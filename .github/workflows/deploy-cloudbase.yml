name: Deploy Tencent CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install build dependencies
        run: npm ci --include=dev

      - name: Build and audit the game
        run: |
          npm run build
          npm run audit:build

      - name: Install the pinned CloudBase CLI
        run: npm install --global @cloudbase/cli@3.8.10

      - name: Deploy the existing application and wait for success
        working-directory: dist
        env:
          TENCENT_ENV_ID: ${{ secrets.TENCENT_ENV_ID }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          CI: 'true'
          NO_UPDATE_NOTIFIER: '1'
        shell: bash
        run: |
          set -euo pipefail
          : "${TENCENT_ENV_ID:?Missing repository secret TENCENT_ENV_ID}"
          : "${TENCENT_SECRET_ID:?Missing repository secret TENCENT_SECRET_ID}"
          : "${TENCENT_SECRET_KEY:?Missing repository secret TENCENT_SECRET_KEY}"
          test -s index.html
          tcb login --apiKeyId "$TENCENT_SECRET_ID" --apiKey "$TENCENT_SECRET_KEY"
          tcb app info shanhe1931-1945 --env-id "$TENCENT_ENV_ID"
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/cloudbase-deploy-$attempt.log"
            set +e
            # Keep the application/version API path and redact signed upload URL queries.
            tcb app deploy shanhe1931-1945 \
              --env-id "$TENCENT_ENV_ID" \
              --framework vite \
              --install-command "true" \
              --build-command "test -s index.html" \
              --output-dir "." \
              --deploy-path "/" \
              --force \
              --yes 2>&1 | tee "$log" | sed -E 's#(https?://[^?[:space:]]+)\?[^[:space:]]+#\1?[redacted]#g'
            statuses=("${PIPESTATUS[@]}")
            set -e
            if (( statuses[1] != 0 || statuses[2] != 0 )); then
              echo "::error::Deployment log capture or redaction failed; do not replay an uncertain deployment."
              exit 1
            fi
            result="${statuses[0]}"
            if (( result == 0 )); then exit 0; fi
            # Retry only a confirmed transient upload failure before creation of a cloud version.
            if (( attempt == 3 )) ||
              ! grep -q 'Code upload failed' "$log" ||
              ! grep -Eq 'ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up' "$log" ||
              grep -q 'Creating cloud app' "$log"; then
              exit "$result"
            fi
            echo "::warning::Upload connection failed before deployment creation; retrying attempt $((attempt + 1))/3."
            sleep "$((attempt * 10))"
          done
          exit 1
